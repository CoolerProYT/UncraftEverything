plugins {
    id 'java-library'
    id 'maven-publish'
}

version = rootProject.version
group = rootProject.mod_group_id
base { archivesName = "${mod_id}-${project.name}-${minecraft_version}" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

repositories {
    mavenCentral()
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://maven.shedaniel.me' }
}

// Match the template's capability used by loaders to select the common library.
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        outgoing.capability("${project.group}:${mod_id}:${project.version}")
    }
}

['jar', 'sourcesJar'].each { taskName ->
    tasks.named(taskName, Jar) {
        from(rootProject.file('LICENSE')) { rename { "${it}_${mod_name}" } }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title': mod_name,
                'Specification-Vendor': mod_authors,
                'Specification-Version': project.version,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors,
                'Built-On-Minecraft': minecraft_version
        ])
    }
}

processResources {
    def expandProps = [
            version: project.version,
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand(expandProps)
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        mavenLocal()
        if (findProperty('maven_url')) {
            maven {
                url = findProperty('maven_url')
                credentials {
                    username = findProperty('maven_username')
                    password = findProperty('maven_password')
                }
            }
        }
    }
}
