plugins {
    id 'base'
    id 'net.neoforged.moddev.legacyforge' version '2.0.77' apply false
    id 'fabric-loom' version '1.10.5' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0' apply false
}

// The root remains a convenient entry point for existing IDE and command-line workflows.
tasks.register('runClient') {
    group = 'forgegradle runs'
    description = 'Run the Forge development client, including optional TaCZ for local testing.'
    dependsOn ':forge:runClient'
}
tasks.register('runServer') {
    group = 'forgegradle runs'
    dependsOn ':forge:runServer'
}
tasks.register('runGameTestServer') {
    group = 'verification'
    dependsOn ':forge:runGameTestServer'
}
tasks.register('test') {
    group = 'verification'
    dependsOn ':common:test', ':forge:test', ':fabric:test'
}
tasks.named('build') { dependsOn ':common:build', ':forge:build', ':fabric:build' }
tasks.named('check') { dependsOn ':common:check', ':forge:check', ':fabric:check' }
tasks.named('clean') { dependsOn ':forge:clean', ':fabric:clean', ':common:clean' }

tasks.register('publishMods') {
    dependsOn ':forge:publishMods', ':fabric:publishMods'
}
