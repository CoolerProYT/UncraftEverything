plugins {
	id 'net.fabricmc.fabric-loom' version '1.14-SNAPSHOT'
	id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/uncrafteverything.classtweaker")
}

repositories {
	maven { url "https://maven.shedaniel.me" }
	maven {
		url 'https://maven.blamejared.com'
	}
	maven {
		url "https://cursemaven.com"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation include("com.electronwill.night-config:core:3.8.1")
    implementation include("com.electronwill.night-config:toml:3.8.1")

	// Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly "mezz.jei:jei-26.1-snapshot-2-neoforge-api:${jei_version}"
//    runtimeOnly "mezz.jei:jei-26.1-snapshot-2-fabric:${jei_version}"

//    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
	// modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"

//    compileOnly "curse.maven:ftb-quests-fabric-438496:6975871"
//    compileOnly "curse.maven:ftb-teams-fabric-438497:6930909"
//    compileOnly "curse.maven:ftb-library-fabric-438495:6975627"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = archives_base_name
			from components.java
		}
	}

	repositories {
        mavenLocal()
        maven {
            url = findProperty("maven_url")
            credentials {
                username = findProperty("maven_username")
                password = findProperty("maven_password")
            }

        }
    }
}

publishMods {
    file.set(jar.archiveFile)
    type = BETA
    modLoaders.add("fabric")
    changelog = file("changelog.md").text
    displayName = "uncrafteverything-" + mod_version

    curseforge {
        projectId = "1244428"
        accessToken = findProperty("CF_TOKEN")
        minecraftVersions.add("26.1-snapshot")
    }

    modrinth {
        projectId = '9cz66Qto'
        accessToken = findProperty("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
    }
}
